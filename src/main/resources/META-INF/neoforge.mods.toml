modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/macuguita/woodworks/issues"

[[mods]]
modId = "gwoodworks"
version = "${version}"
displayName = "guita's Woodworks"
description = '''Decorations that have some sort of chopped charm!'''
authors = "macuguita"
logoFile = "assets/gwoodworks/logo.png"
logoBlur = false
displayURL = "https://macuguita.com"
issueTrackerURL = "https://github.com/macuguita/woodworks/issues"
updateJSONURL = "https://api.modrinth.com/updates/NTFyR6MX/forge_updates.json?neoforge=only"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "gwoodworks.mixins.json"

[[dependencies.gwoodworks]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.181,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gwoodworks]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"

[[dependencies.gwoodworks]]
modId = "macu_lib"
type = "required"
versionRange = "${macu_lib_ver}"

[modproperties.macu_lib]
catalogueImageIcon = "assets/gwoodworks/logo.png"
